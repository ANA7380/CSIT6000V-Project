<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1130" viewBox="0 0 1080 1130" role="img" aria-label="单 Agent 的有界工具反馈循环"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#486477"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#203643"><text x="540.0" y="35" font-size="22" text-anchor="middle" fill="#203643"><tspan x="540.0" dy="0">单 Agent 的有界工具反馈循环</tspan></text><rect x="360" y="65" width="360" height="65" rx="9" fill="#fff" stroke="#8ca7b7" stroke-width="1.5"/><text x="540.0" y="102.5" font-size="15" text-anchor="middle" fill="#203643"><tspan x="540.0" dy="0">A 接收问题 备份状态 turn ID</tspan></text><rect x="360" y="170" width="360" height="80" rx="9" fill="#fff" stroke="#8ca7b7" stroke-width="1.5"/><text x="540.0" y="204.0" font-size="15" text-anchor="middle" fill="#203643"><tspan x="540.0" dy="0">B 构建上下文</tspan><tspan x="540.0" dy="21.75">唯一 system + 状态 + 历史</tspan></text><rect x="360" y="295" width="360" height="80" rx="9" fill="#e8f2ff" stroke="#4b7ca9" stroke-width="1.5"/><text x="540.0" y="329.0" font-size="15" text-anchor="middle" fill="#203643"><tspan x="540.0" dy="0">C Qwen 决策</tspan><tspan x="540.0" dy="21.75">输出 tool 或 answer JSON</tspan></text><rect x="360" y="420" width="360" height="65" rx="9" fill="#fff" stroke="#8ca7b7" stroke-width="1.5"/><text x="540.0" y="457.5" font-size="15" text-anchor="middle" fill="#203643"><tspan x="540.0" dy="0">D 解析协议与白名单校验</tspan></text><rect x="40" y="550" width="390" height="75" rx="9" fill="#e9f5ee" stroke="#50856a" stroke-width="1.5"/><text x="235.0" y="581.5" font-size="15" text-anchor="middle" fill="#203643"><tspan x="235.0" dy="0">E 工具执行</tspan><tspan x="235.0" dy="21.75">校验参数 合并排名偏好</tspan></text><rect x="40" y="680" width="390" height="105" rx="9" fill="#e9f5ee" stroke="#50856a" stroke-width="1.5"/><text x="235.0" y="715.5" font-size="15" text-anchor="middle" fill="#203643"><tspan x="235.0" dy="0">F 保存证据与观察</tspan><tspan x="235.0" dy="21.75">E 编号 状态更新</tspan><tspan x="235.0" dy="21.75">追加 TOOL_RESULT</tspan></text><rect x="650" y="550" width="390" height="75" rx="9" fill="#fff" stroke="#8ca7b7" stroke-width="1.5"/><text x="845.0" y="581.5" font-size="15" text-anchor="middle" fill="#203643"><tspan x="845.0" dy="0">G 最终解释校验</tspan><tspan x="845.0" dy="21.75">引用 ID 数字字符 URL</tspan></text><rect x="650" y="785" width="390" height="85" rx="9" fill="#fff" stroke="#8ca7b7" stroke-width="1.5"/><text x="845.0" y="821.5" font-size="15" text-anchor="middle" fill="#203643"><tspan x="845.0" dy="0">H 合格回答 + 确定性证据</tspan><tspan x="845.0" dy="21.75">生成页面响应 保存快照</tspan></text><rect x="650" y="970" width="390" height="85" rx="9" fill="#fff4e4" stroke="#ae8651" stroke-width="1.5"/><text x="845.0" y="1006.5" font-size="15" text-anchor="middle" fill="#203643"><tspan x="845.0" dy="0">有界降级或报错</tspan><tspan x="845.0" dy="21.75">保留已验证工具结果</tspan></text><rect x="45" y="930" width="385" height="110" rx="9" fill="#fff4e4" stroke="#ae8651" stroke-width="1.5"/><text x="237.5" y="968.0" font-size="15" text-anchor="middle" fill="#203643"><tspan x="237.5" dy="0">循环上限 12 次模型调用</tspan><tspan x="237.5" dy="21.75">解释校验累计两次失败即降级</tspan><tspan x="237.5" dy="21.75">外围异常回滚本轮内存状态</tspan></text><polyline points="540,130 540,170" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,250 540,295" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,375 540,420" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="420,485 420,520 235,520 235,550" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><text x="300" y="511" font-size="13" text-anchor="middle" fill="#203643"><tspan x="300" dy="0">tool</tspan></text><polyline points="660,485 660,520 845,520 845,550" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><text x="791" y="511" font-size="13" text-anchor="middle" fill="#203643"><tspan x="791" dy="0">answer</tspan></text><polyline points="235,625 235,680" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="40,730 18,730 18,210 360,210" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><text x="170" y="281" font-size="13" text-anchor="middle" fill="#203643"><tspan x="170" dy="0">观察后再决策</tspan></text><polyline points="360,450 310,450 310,265 540,265 540,295" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="170" y="408" font-size="13" text-anchor="middle" fill="#203643"><tspan x="170" dy="0">MODEL_FORMAT_ERROR</tspan></text><polyline points="845,625 845,785" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)"/><text x="895" y="710" font-size="13" text-anchor="middle" fill="#203643"><tspan x="895" dy="0">校验通过</tspan></text><polyline points="1040,590 1060,590 1060,210 720,210" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="883" y="248" font-size="13" text-anchor="middle" fill="#203643"><tspan x="883" dy="0">首次失败后修正</tspan></text><polyline points="650,600 590,600 590,1012 650,1012" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="536" y="905" font-size="13" text-anchor="middle" fill="#203643"><tspan x="536" dy="0">达到修正上限</tspan></text><polyline points="430,985 650,985" fill="none" stroke="#486477" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="536" y="974" font-size="13" text-anchor="middle" fill="#203643"><tspan x="536" dy="0">总预算耗尽</tspan></text><text x="540" y="1101" font-size="14" text-anchor="middle" fill="#203643"><tspan x="540" dy="0">蓝色节点才调用 LLM；绿色节点执行确定性算法；虚线表示错误反馈或上限分支</tspan></text></g></svg>