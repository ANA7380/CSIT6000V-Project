entrypoint:
  - bash ${TACC_WORKDIR}/job.sh web
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: stock-chat
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=01:00:00
    - output=${TACC_SLURM_USERLOG}/stock-chat-%j.log
