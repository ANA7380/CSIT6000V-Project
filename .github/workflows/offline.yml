name: Offline verification
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s agent -v
      - run: python scripts/export_snapshot.py --check
      - run: python evaluation/run.py --mode offline --output "${{ runner.temp }}/evaluation"
