entrypoint:
  - bash ${TACC_WORKDIR}/job.sh
environment:
  name: proxy
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: stock-agent-eval
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=1
    - time=00:50:00
    - output=${TACC_SLURM_USERLOG}/eval-%j.log
